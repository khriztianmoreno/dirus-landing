name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    # Renaming this job would break branch protection on main and develop:
    # both require this exact status check context, and a renamed job leaves
    # every pull request waiting on a check that no longer reports.
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        # Full history: commitlint needs the commits between the base and the
        # head of the pull request, and the default shallow fetch has neither.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        # Caches the pnpm content-addressable store, keyed on pnpm-lock.yaml.
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The commit-msg hook can be skipped with --no-verify, so the rule is
      # only real once it also runs here.
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Coverage runs the suite, so a separate plain test step would execute
      # every test twice for no extra signal. The 90% thresholds on
      # statements, branches, functions and lines live in vitest.config.mts
      # and exit non-zero when any of them falls short.
      - name: Unit tests and coverage (90% gate)
        run: pnpm test:coverage

      - name: Upload coverage report
        # Runs even when the gate fails — that is exactly when someone needs
        # to see which lines are uncovered.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.{ts,tsx}', '*.{ts,mts,mjs}') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - name: Build
        run: pnpm build
